name: Platform CI

on:
  workflow_call:
    inputs:
      trusted:
        description: Use the persistent home runner fleet
        required: true
        type: boolean
      checkout_repository:
        description: Repository containing the exact commit to test
        required: true
        type: string
      checkout_ref:
        description: Exact commit SHA to test
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ inputs.trusted && 'grimalkin-windows-vm' || format('grimalkin-hosted-ci-{0}', github.run_id) }}
  cancel-in-progress: false

jobs:
  linux-trusted:
    name: Linux native tests (trusted)
    if: inputs.trusted
    runs-on: [self-hosted, linux, x64, grimalkin-linux]
    container:
      image: localhost:5000/grimalkin-linux-ci:ubuntu-22.04
      volumes:
        - grimalkin-linux-vcpkg:/var/cache/grimalkin-vcpkg
    timeout-minutes: 60
    env:
      GRIMALKIN_LINUX_BUILD_DIR: ${{ github.workspace }}/build/linux-native-ci
      GRIMALKIN_LINUX_CACHE_DIR: ${{ github.workspace }}/build/linux-native-cache
      VCPKG_DEFAULT_BINARY_CACHE: /var/cache/grimalkin-vcpkg/ubuntu-22.04
      GRIMALKIN_LINUX_TEST_FONT_PATH: /usr/share/fonts/truetype/dejavu/DejaVuSansMono.ttf
      GRIMALKIN_LINUX_TEST_CJK_FONT_PATH: /usr/share/fonts/opentype/noto/NotoSansCJK-Regular.ttc

    steps:
      - name: Check out exact source commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ inputs.checkout_repository }}
          ref: ${{ inputs.checkout_ref }}
          persist-credentials: false
          clean: false

      - name: Run native checks, tests, build, and software-GPU coverage
        shell: bash
        run: scripts/build-linux-native.sh check test build test-gpu

  linux-untrusted:
    name: Linux native tests (isolated contributor)
    if: ${{ !inputs.trusted }}
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      GRIMALKIN_LINUX_BUILD_DIR: ${{ github.workspace }}/build/linux-native-ci
      GRIMALKIN_LINUX_CACHE_DIR: ${{ github.workspace }}/build/linux-native-cache
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/build/linux-native-cache/vcpkg-cache

    steps:
      - name: Check out exact source commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ inputs.checkout_repository }}
          ref: ${{ inputs.checkout_ref }}
          persist-credentials: false

      - name: Install native host prerequisites
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            autoconf autoconf-archive automake build-essential ca-certificates \
            clang cmake curl fonts-dejavu-core fonts-noto-cjk git glslc \
            libtool libvulkan1 libx11-dev libxcursor-dev libxi-dev \
            libxinerama-dev libxrandr-dev mesa-vulkan-drivers ninja-build \
            pkg-config python3 unzip xauth xvfb xz-utils zip

      - name: Restore isolated native dependency cache
        id: native-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            build/linux-native-cache/downloads
            build/linux-native-cache/toolchains
            build/linux-native-cache/ghostty
            build/linux-native-cache/zig-cache
            build/linux-native-cache/vcpkg-cache
            build/linux-native-ci/vcpkg_installed
          key: grimalkin-untrusted-linux-x64-${{ hashFiles('vcpkg.json', 'ghostty-revision.txt', 'Makefile', 'scripts/linux-toolchain.env', 'scripts/build-linux-native.sh', 'scripts/libghostty-vt.pc.in', 'src/shaders/manifest.txt', 'src/shaders/colour.glsl') }}
          restore-keys: |
            grimalkin-untrusted-linux-x64-

      - name: Run native checks, tests, build, and software-GPU coverage
        shell: bash
        run: scripts/build-linux-native.sh check test build test-gpu

      - name: Save isolated native dependency cache
        if: ${{ success() && steps.native-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            build/linux-native-cache/downloads
            build/linux-native-cache/toolchains
            build/linux-native-cache/ghostty
            build/linux-native-cache/zig-cache
            build/linux-native-cache/vcpkg-cache
            build/linux-native-ci/vcpkg_installed
          key: grimalkin-untrusted-linux-x64-${{ hashFiles('vcpkg.json', 'ghostty-revision.txt', 'Makefile', 'scripts/linux-toolchain.env', 'scripts/build-linux-native.sh', 'scripts/libghostty-vt.pc.in', 'src/shaders/manifest.txt', 'src/shaders/colour.glsl') }}

  macos:
    name: macOS Apple Silicon native build
    runs-on: ${{ inputs.trusted && 'grimalkin-macos' || 'macos-15' }}
    timeout-minutes: 90
    env:
      GRIMALKIN_MACOS_BUILD_DIR: ${{ github.workspace }}/build/macos-native-ci

    steps:
      - name: Check out exact source commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ inputs.checkout_repository }}
          ref: ${{ inputs.checkout_ref }}
          persist-credentials: false

      - name: Restore isolated native dependency cache
        if: ${{ !inputs.trusted }}
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/Library/Caches/grimalkin-macos-native/downloads
            ~/Library/Caches/grimalkin-macos-native/toolchains
            ~/Library/Caches/grimalkin-macos-native/ghostty
            ~/Library/Caches/grimalkin-macos-native/zig-cache
            ~/Library/Caches/grimalkin-macos-native/vcpkg-cache
          key: grimalkin-${{ inputs.trusted && 'trusted' || 'untrusted' }}-macos-arm64-${{ hashFiles('vcpkg.json', 'ghostty-revision.txt', 'Makefile', 'scripts/macos-toolchain.env', 'scripts/build-macos-native.sh', 'src/shaders/manifest.txt', 'src/shaders/colour.glsl', 'assets/macos/Info.plist.in', 'assets/macos/fonts.conf') }}
          restore-keys: |
            grimalkin-${{ inputs.trusted && 'trusted' || 'untrusted' }}-macos-arm64-

      - name: Build and verify native application bundle
        shell: bash
        run: |
          cache_root="$HOME/Library/Caches/grimalkin-macos-native"
          source scripts/macos-toolchain.env
          cmake_bin="$cache_root/toolchains/cmake-$CMAKE_VERSION/CMake.app/Contents/bin"
          PATH="$cmake_bin:$PATH" \
          GRIMALKIN_MACOS_CACHE_DIR="$cache_root" \
          VCPKG_DEFAULT_BINARY_CACHE="$cache_root/vcpkg-cache" \
            scripts/build-macos-native.sh build/macos-native-ci/Grimalkin.app check test build

  start-windows-runner:
    name: Start trusted Windows runner VM
    if: inputs.trusted
    runs-on: grimalkin-linux
    timeout-minutes: 5
    env:
      GRIMALKIN_WINDOWS_VM_NAME: ${{ vars.GRIMALKIN_WINDOWS_VM_NAME }}
      GRIMALKIN_WINDOWS_RUNNER_SERVICE: ${{ vars.GRIMALKIN_WINDOWS_RUNNER_SERVICE }}

    steps:
      - name: Check out trusted runner helper
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ inputs.checkout_repository }}
          ref: ${{ inputs.checkout_ref }}
          persist-credentials: false

      - name: Start VM and wait for the guest agent
        shell: bash
        run: bash scripts/start-windows-runner.sh

  windows:
    name: Windows x64 native build
    needs: start-windows-runner
    if: ${{ always() && (!inputs.trusted || needs.start-windows-runner.result == 'success') }}
    runs-on: ${{ inputs.trusted && 'grimalkin-windows' || 'windows-2025' }}
    timeout-minutes: 120
    env:
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}\build\windows\vcpkg-cache
      ZIG_GLOBAL_CACHE_DIR: ${{ github.workspace }}\build\windows\zig-cache

    steps:
      - name: Configure persistent trusted dependency cache
        if: inputs.trusted
        shell: pwsh
        run: |
          $runnerRoot = Split-Path -Parent (Split-Path -Parent $env:RUNNER_TEMP)
          $cacheRoot = Join-Path $runnerRoot '_cache\grimalkin-windows-native'
          New-Item -ItemType Directory -Path $cacheRoot -Force | Out-Null
          "GRIMALKIN_WINDOWS_CACHE_DIR=$cacheRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "VCPKG_DEFAULT_BINARY_CACHE=$(Join-Path $cacheRoot 'vcpkg-cache')" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "ZIG_GLOBAL_CACHE_DIR=$(Join-Path $cacheRoot 'zig-cache')" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Check out exact source commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ inputs.checkout_repository }}
          ref: ${{ inputs.checkout_ref }}
          persist-credentials: false

      - name: Expose Git archive tools
        if: ${{ !inputs.trusted }}
        shell: pwsh
        run: |
          $gitUsrBin = Join-Path $env:ProgramFiles 'Git\usr\bin'
          $gzip = Join-Path $gitUsrBin 'gzip.exe'
          if (-not (Test-Path -LiteralPath $gzip)) {
              throw "Git for Windows gzip was not found at $gzip"
          }
          $gitUsrBin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Restore isolated native dependency cache
        id: native-cache
        if: ${{ !inputs.trusted }}
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            build/windows/downloads
            build/windows/toolchains
            build/windows/_deps
            build/windows/vcpkg-cache
            build/windows/zig-cache
          key: grimalkin-${{ inputs.trusted && 'trusted' || 'untrusted' }}-windows-x64-${{ hashFiles('vcpkg.json', 'ghostty-revision.txt', 'CMakeLists.txt', 'cmake/BootstrapZig.cmake', 'build-windows.ps1', 'scripts/setup-windows-release.ps1') }}
          restore-keys: |
            grimalkin-${{ inputs.trusted && 'trusted' || 'untrusted' }}-windows-x64-

      - name: Set up pinned Windows tools
        shell: pwsh
        run: .\scripts\setup-windows-release.ps1

      - name: Run native Windows tests and build the application
        shell: pwsh
        run: .\build-windows.ps1 -Configuration Release -Target grimalkin_ci

      - name: Save isolated native dependency cache
        if: ${{ success() && !inputs.trusted && steps.native-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            build/windows/downloads
            build/windows/toolchains
            build/windows/_deps
            build/windows/vcpkg-cache
            build/windows/zig-cache
          key: grimalkin-${{ inputs.trusted && 'trusted' || 'untrusted' }}-windows-x64-${{ hashFiles('vcpkg.json', 'ghostty-revision.txt', 'CMakeLists.txt', 'cmake/BootstrapZig.cmake', 'build-windows.ps1', 'scripts/setup-windows-release.ps1') }}
