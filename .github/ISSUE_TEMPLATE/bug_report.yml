name: Bug report
description: Report a reproducible problem in Grimalkin
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Remove private terminal output and credentials before submitting.
  - type: input
    id: version
    attributes:
      label: Grimalkin version
      description: Release number or commit hash
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - Linux
        - macOS
        - Windows
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: OS version, GPU and driver, shell, and affected terminal application
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Include the expected and actual behaviour.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: Provide the smallest safe example that reproduces the problem.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or screenshots
      description: Optional. Redact private content before attaching anything.
  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues for this problem.
          required: true
        - label: This report does not contain credentials or private terminal content.
          required: true
        - label: This is not an undisclosed security vulnerability.
          required: true
